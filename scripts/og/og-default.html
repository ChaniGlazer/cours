<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- מקור תמונת השיתוף public/og-default.png (1200x630). עריכה: לשנות כאן ולצלם מחדש, ראו scripts/og/README.md -->
<style>
@font-face { font-family: "Assistant"; font-weight: 400 700; src: url("../../public/fonts/assistant-hebrew.woff2") format("woff2"); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: "Assistant"; font-weight: 400 700; src: url("../../public/fonts/assistant-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122; }
@font-face { font-family: "Secular One"; src: url("../../public/fonts/secular-one-hebrew.woff2") format("woff2"); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: "Secular One"; src: url("../../public/fonts/secular-one-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122; }
@font-face { font-family: "JetBrains Mono"; font-weight: 400 600; src: url("../../public/fonts/jetbrains-mono-latin.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: #14121F; color: #F4F1FA; font-family: "Assistant", sans-serif; position: relative; }
.glow { position: absolute; inset: 0; background: radial-gradient(700px 420px at 12% 8%, rgba(255,127,150,.20), transparent 70%), radial-gradient(600px 400px at 95% 100%, rgba(111,224,160,.14), transparent 70%); }
.frame { position: absolute; inset: 28px; border: 2px solid #3A3558; border-radius: 28px; }
.wrap { position: absolute; inset: 0; padding: 78px 84px; display: flex; flex-direction: column; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 18px; }
.mark { width: 72px; height: 72px; border-radius: 20px; background: #FF7F96; color: #14121F; display: flex; align-items: center; justify-content: center; font: 600 32px "JetBrains Mono", monospace; direction: ltr; }
.brand b { font: 400 34px "Secular One", sans-serif; color: #BDB7D3; }
h1 { font: 400 92px/1.08 "Secular One", sans-serif; letter-spacing: -.01em; }
h1 span { color: #FF7F96; }
p { font-size: 36px; line-height: 1.4; color: #BDB7D3; margin-top: 20px; max-width: 760px; }
.code { position: absolute; left: 84px; top: 190px; direction: ltr; text-align: left; font: 600 30px/1.6 "JetBrains Mono", monospace; color: #F4F1FA; background: #1D1A2D; border: 2px solid #3A3558; border-radius: 22px; padding: 22px 30px; }
.code i { font-style: normal; color: #FF7F96; } .code u { text-decoration: none; color: #6FE0A0; } .code em { font-style: normal; color: #FFD27A; }
.url { font: 600 28px "JetBrains Mono", monospace; color: #6FE0A0; direction: ltr; text-align: right; }
</style>
</head>
<body>
<div class="glow"></div><div class="frame"></div>
<div class="wrap">
  <div class="brand"><div class="mark">&lt;/&gt;</div><b>קורסים בעידן ה-AI</b></div>
  <div>
    <h1>לומדים פייתון<br><span>בעברית, בחינם</span></h1>
    <p>שיעורים אינטראקטיביים עם תרגילים ובדיקה אוטומטית</p>
  </div>
  <div class="url">course.codebloom.co.il</div>
</div>
<div class="code"><i>for</i> i <i>in</i> <u>range</u>(<em>3</em>):<br>&nbsp;&nbsp;&nbsp;&nbsp;<u>print</u>(<em>"hello"</em>)</div>
</body>
</html>
